name: Update results and deploy

on:
  schedule:
    # Draws end between about 8 and 9pm UK time. The late run picks up same-night results;
    # the morning run catches anything published late and the confirmed prize breakdowns.
    - cron: '35 22 * * *'
    - cron: '15 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch new results
        run: node scripts/update.mjs

      - name: Commit changed data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update results $(date -u +%Y-%m-%d)"
            git push || echo "::warning::Could not push the data commit; the next run will retry."
          else
            echo "No new results."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
