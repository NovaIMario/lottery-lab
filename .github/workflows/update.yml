name: Update results and deploy

on:
  schedule:
    # Every 30 minutes on draw evenings (19:07 to 23:37 UTC), when the UK, Irish and European results come out.
    - cron: '7,37 19-23 * * *'
    # Every hour in the afternoon (12:20 to 18:20 UTC), for the US results New York publishes the day after a draw.
    - cron: '20 12-18 * * *'
    # Once every morning: a full refresh of every game, which also picks up confirmed prize breakdowns.
    - cron: '15 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Scheduled runs redeploy only when the data changed; pushes and manual runs always do.
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch new results
        # The half-hourly and hourly runs only fetch games with a draw due (--due); the morning run,
        # pushes and manual runs refresh everything.
        env:
          MODE: ${{ github.event_name == 'schedule' && github.event.schedule != '15 7 * * *' && '--due' || '' }}
        run: node scripts/update.mjs $MODE

      - name: Commit changed data
        id: commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update results $(date -u +%Y-%m-%d)"
            git push || echo "::warning::Could not push the data commit; the next run will retry."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new results."
          fi

      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
